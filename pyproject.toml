[project]
name = "ha-elevations"
version = "0.1.0"
description = "Home Assistant blueprints, organised by context"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  # Leads live Home Assistant: Renovate bumps it, and a green bump means live HA
  # is safe to upgrade to that release (ADR 0008). Must pin a stable HA, not a beta.
  "pytest-homeassistant-custom-component==0.13.357",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The repo-wide checks, then every context's tests (ADR 0007).
testpaths = ["tests", "*/tests", "*/*/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
