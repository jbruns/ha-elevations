[project]
name = "ha-elevations"
version = "0.1.0"
description = "Home Assistant blueprints and Frigate config for Front Door Notifications"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  # Pinned to the Home Assistant release running live, so tests exercise the same core.
  "pytest-homeassistant-custom-component==0.13.357",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
