[project]
name = "ha-elevations"
version = "0.1.0"
description = "Home Assistant blueprints, organised by context"
requires-python = ">=3.14.2"
# The insteon command (insteon-network/) is a workspace member, so `uv run insteon` works.
dependencies = ["insteon-network"]

[dependency-groups]
dev = [
  # Leads live Home Assistant: Renovate bumps it, and a green bump means live HA
  # is safe to upgrade to that release (ADR 0008). Must pin a stable HA, not a beta.
  "pytest-homeassistant-custom-component==0.13.375",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["insteon-network"]

[tool.uv.sources]
insteon-network = { workspace = true }

[tool.pytest.ini_options]
# The repo-wide checks, then every context's tests (ADR 0007).
testpaths = ["tests", "*/tests", "*/*/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
