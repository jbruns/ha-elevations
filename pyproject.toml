[project]
name = "ha-elevations"
version = "0.1.0"
description = "Home Assistant blueprints, organised by context"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  # Pinned to the Home Assistant release running live, so tests exercise the same core.
  "pytest-homeassistant-custom-component==0.13.357",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The repo-wide checks, then every context's tests (ADR 0007).
testpaths = ["tests", "*/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
