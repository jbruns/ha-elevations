[project]
name = "insteon-network"
version = "0.1.0"
description = "The insteon command: manage the Insteon network on IoX and Reconcile Home Assistant to it"
requires-python = ">=3.14.2"
dependencies = [
  # Already in the dev environment through Home Assistant; left unpinned so the
  # HA test pin decides the version (ADR 0008).
  "aiohttp>=3.9",
  "asyncssh>=2.14",
]

[project.scripts]
insteon = "insteon.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "insteon"
module-root = ""
