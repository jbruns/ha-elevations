title: Home
background:
  opacity: 100
  alignment: center
  size: cover
  repeat: no-repeat
  attachment: scroll
  image:
    media_content_id: '{WALLBOARD_BACKGROUND_IMAGE_URL}'
    media_content_type: ''
    metadata:
      navigateIds:
      - {}
      - media_content_type: ''
        media_content_id: __MANUAL_ENTRY__
cards: []
type: sections
sections:
- sections/schedule.yaml
- sections/chores.yaml
- sections/status.yaml
max_columns: 4
theme: Caule Light Blue
badges:
- type: custom:mushroom-template-badge
  entity: '{CLIMATE_EXTERIOR_DOORS_ROLE}'
  label: Open Doors
  content: '{{ expand(''{CLIMATE_EXTERIOR_DOORS_ROLE}'') | selectattr(''state'', ''eq'',
    ''on'') | map(attribute=''name'') | join('', '') if is_state(''{CLIMATE_EXTERIOR_DOORS_ROLE}'',
    ''on'') else ''Clear'' }}'
  icon: '{{ ''mdi:door-open'' if is_state(''{CLIMATE_EXTERIOR_DOORS_ROLE}'', ''on'')
    else ''mdi:door-closed'' }}'
  color: '{{ ''orange'' if is_state(''{CLIMATE_EXTERIOR_DOORS_ROLE}'', ''on'') else
    ''green'' }}'
  tap_action:
    action: none
- type: custom:mushroom-template-badge
  entity: binary_sensor.wallboard_any_entry_unlocked
  label: Unlocked Entries
  content: '{{ states(''sensor.wallboard_unlocked_entries'') if is_state(''binary_sensor.wallboard_any_entry_unlocked'',
    ''on'') else ''Clear'' }}'
  icon: '{{ ''mdi:lock-open-alert'' if is_state(''binary_sensor.wallboard_any_entry_unlocked'',
    ''on'') else ''mdi:lock-check'' }}'
  color: '{{ ''orange'' if is_state(''binary_sensor.wallboard_any_entry_unlocked'',
    ''on'') else ''green'' }}'
  tap_action:
    action: none
- type: custom:mushroom-template-badge
  entity: binary_sensor.wallboard_washer_active
  label: Washer
  content: '{% set activity = states(''binary_sensor.wallboard_washer_active'') %}{{
    ''Running'' if activity == ''on'' else ''Ready'' if activity == ''off'' else ''Checking''
    }} | {{ states(''{WASHER_POWER_SENSOR}'') | float(0) | round(0) }} W'
  icon: mdi:washing-machine
  color: '{{ ''blue'' if is_state(''binary_sensor.wallboard_washer_active'', ''on'')
    else ''grey'' }}'
  tap_action:
    action: more-info
    entity: '{WASHER_POWER_SENSOR}'
- type: custom:mushroom-template-badge
  entity: binary_sensor.wallboard_dryer_active
  label: Dryer
  content: '{% set activity = states(''binary_sensor.wallboard_dryer_active'') %}{{
    ''Running'' if activity == ''on'' else ''Ready'' if activity == ''off'' else ''Checking''
    }} | {{ states(''{DRYER_POWER_SENSOR}'') | float(0) | round(0) }} W'
  icon: mdi:tumble-dryer
  color: '{{ ''orange'' if is_state(''binary_sensor.wallboard_dryer_active'', ''on'')
    else ''grey'' }}'
  tap_action:
    action: more-info
    entity: '{DRYER_POWER_SENSOR}'
- type: custom:mushroom-template-badge
  entity: binary_sensor.wallboard_dishwasher_active
  label: Dishwasher
  content: '{% set activity = states(''binary_sensor.wallboard_dishwasher_active'')
    %}{{ ''Running'' if activity == ''on'' else ''Ready'' if activity == ''off'' else
    ''Checking'' }} | {{ states(''{DISHWASHER_POWER_SENSOR}'') | float(0) | round(0)
    }} W'
  icon: mdi:dishwasher
  color: '{{ ''teal'' if is_state(''binary_sensor.wallboard_dishwasher_active'', ''on'')
    else ''grey'' }}'
  tap_action:
    action: more-info
    entity: '{DISHWASHER_POWER_SENSOR}'
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: '{ADULT_A_PERSON}'
  color: ''
  name: '{ADULT_A_NAME}'
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: '{ADULT_B_PERSON}'
  color: ''
  name: '{ADULT_B_NAME}'
- type: entity
  show_name: false
  show_state: true
  show_icon: true
  entity: '{THERMOSTAT}'
  color: ''
- type: entity
  show_name: false
  show_state: true
  show_icon: true
  entity: '{OUTDOOR_AQI_SENSOR}'
  color: ''
  icon: mdi:air-filter
