# Rail: about 1/3 of the width, right of the Household Schedule.
type: grid
column_span: 1
cards:
# #58 replaces this placeholder with Today and Countdowns.
- type: markdown
  content: |-
    ### Today
    Today and Countdowns will appear here.
  grid_options:
    columns: full
    rows: 4
# #59 replaces this placeholder with Chores and Claim.
- type: markdown
  content: |-
    ### Chores
    Chores and Claims will appear here.
  grid_options:
    columns: full
    rows: 4
# Lists: two half-width lists in a 4-row band. On a School Day afternoon,
# After-School Tasks takes the Family Reminders slot.
- type: todo-list
  entity: '{SHOPPING_LIST_TODO}'
  title: Shopping List
  hide_completed: true
  hide_section_headers: true
  grid_options:
    columns: 6
    rows: 4
- type: todo-list
  entity: '{FAMILY_REMINDERS_TODO}'
  title: Family Reminders
  hide_completed: true
  hide_section_headers: true
  visibility:
  - condition: or
    conditions:
    - condition: state
      entity: '{TODAY_SCHOOL_DAY_HELPER}'
      state_not: 'on'
    - condition: time
      before: '12:00'
  grid_options:
    columns: 6
    rows: 4
- type: todo-list
  entity: '{AFTER_SCHOOL_TASKS_TODO}'
  title: After-School Tasks
  hide_completed: true
  hide_section_headers: true
  visibility:
  - condition: state
    entity: '{TODAY_SCHOOL_DAY_HELPER}'
    state: 'on'
  - condition: time
    after: '12:00'
  grid_options:
    columns: 6
    rows: 4
