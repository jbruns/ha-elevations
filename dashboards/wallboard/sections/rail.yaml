# Rail: about 1/3 of the width, right of the Household Schedule.
type: grid
column_span: 1
cards:
# Today: on a School Day, the banner, each child's Special Class and today's
# School Lunch, plus tomorrow's from 15:00 when tomorrow is a School Day too.
# On other days, tomorrow's School Lunch when tomorrow is a School Day.
# Hidden when neither is, so Countdowns move up.
- type: markdown
  content: |-
    {%- set school_today = is_state('{TODAY_SCHOOL_DAY_HELPER}', 'on') -%}
    {%- set school_tomorrow = is_state('{TOMORROW_SCHOOL_DAY_HELPER}', 'on') -%}
    {%- set lunch_today = state_attr('sensor.wallboard_school_lunch', 'today') or '' -%}
    {%- set lunch_tomorrow = state_attr('sensor.wallboard_school_lunch', 'tomorrow') or '' -%}
    {%- set classes = [
      ("{CHILD_A_NAME}", states('{CHILD_A_SPECIAL_CLASS_DROPDOWN}')),
      ("{CHILD_B_NAME}", states('{CHILD_B_SPECIAL_CLASS_DROPDOWN}')),
    ] | rejectattr('1', 'in', ['No class', 'Not set', 'unknown', 'unavailable']) | map('join', ': ') | list -%}
    {%- set lines = (['**Special Classes** · ' ~ classes | join(' · ')] if school_today and classes else [])
      + (['**School Lunch** · ' ~ lunch_today] if school_today and lunch_today else [])
      + (["**Tomorrow's lunch** · " ~ lunch_tomorrow]
        if school_tomorrow and lunch_tomorrow and (not school_today or now().hour >= 15) else []) -%}
    <ha-alert alert-type="info"><b>{{ 'School Day' if school_today else 'School Day tomorrow' }}</b></ha-alert>

    {{ lines | join('<br>') }}
  visibility:
  - condition: or
    conditions:
    - condition: state
      entity: '{TODAY_SCHOOL_DAY_HELPER}'
      state: 'on'
    - condition: state
      entity: '{TOMORROW_SCHOOL_DAY_HELPER}'
      state: 'on'
  grid_options:
    columns: full
    rows: 3
# Countdowns: up to four, soonest first, from the Wallboard package. Hidden when there are none.
- type: markdown
  content: |-
    {%- for countdown in (state_attr('sensor.wallboard_countdowns', 'countdowns') or [])[:4] -%}
      {%- set days = countdown['days'] | int(0) -%}
      **{{ 'Today' if days == 0 else 'Tomorrow' if days == 1 else days ~ ' days' }}** · {{ countdown['title'] }}
      {{- '<br>' if not loop['last'] }}
    {% endfor -%}
  visibility:
  - condition: numeric_state
    entity: sensor.wallboard_countdowns
    above: 0
  grid_options:
    columns: full
    rows: 2
# Chores: each child's overdue and due-today Chores from ChoreOps. Tap a Chore to Claim it.
# A claimed Chore stays greyed until a parent approves it on the Chores dashboard.
- type: custom:auto-entities
  card:
    type: grid
    columns: 2
    square: false
  card_param: cards
  filter:
    template: |-
      {%- set children = [
        ("{CHILD_A_NAME}", "{CHILD_A_CHOREOPS_DASHBOARD_HELPER}"),
        ("{CHILD_B_NAME}", "{CHILD_B_CHOREOPS_DASHBOARD_HELPER}"),
      ] -%}
      {%- set limit = 6 -%}
      {%- set chip_style = 'ha-card { --mush-chip-height: 40px; --mush-chip-font-size: 0.36em; --mush-chip-spacing: 6px; }' -%}
      {%- set claimed_style = ' mushroom-template-chip:nth-child(n+%d):nth-child(-n+%d) { opacity: 0.45; }' -%}
      {%- for name, helper in children -%}
        {%- set today = state_attr(helper, 'chores') or [] -%}
        {%- set today = today | selectattr('primary_group', 'eq', 'today') | list -%}
        {%- set chores = (today | selectattr('state', 'eq', 'overdue') | list)
          + (today | selectattr('state', 'in', ['due', 'pending']) | list)
          + (today | selectattr('state', 'eq', 'claimed') | list) -%}
        {%- set shown = chores[:limit] -%}
        {%- set more = (chores | count) - (shown | count) -%}
        {%- set claimed = shown | selectattr('state', 'eq', 'claimed') | list | count -%}
        {'type': 'vertical-stack', 'cards': [
          {'type': 'heading', 'heading': {{ name | tojson }}, 'heading_style': 'title'},
          {'type': 'custom:mushroom-chips-card', 'chips': [
        {%- for chore in shown -%}
          {%- set claim = state_attr(chore['eid'], 'claim_button_eid') -%}
          {%- if chore['state'] == 'claimed' -%}
            {{ {'type': 'template', 'content': chore['name'], 'icon': 'mdi:timer-sand', 'icon_color': 'disabled',
              'tap_action': {'action': 'none'}} }},
          {%- else -%}
            {{ {'type': 'template', 'content': chore['name'],
              'icon': 'mdi:alert-circle-outline' if chore['state'] == 'overdue' else 'mdi:checkbox-blank-circle-outline',
              'icon_color': 'red' if chore['state'] == 'overdue' else 'amber',
              'tap_action': {'action': 'perform-action', 'perform_action': 'button.press', 'target': {'entity_id': claim}}
                if claim else {'action': 'none'}} }},
          {%- endif -%}
        {%- endfor -%}
        {%- if more > 0 -%}
            {{ {'type': 'template', 'content': '+%d more' | format(more), 'tap_action': {'action': 'none'}} }},
        {%- elif not shown -%}
            {{ {'type': 'template', 'content': 'Nothing due', 'icon': 'mdi:check-circle-outline', 'icon_color': 'green',
              'tap_action': {'action': 'none'}} }},
        {%- endif -%}
          ], 'card_mod': {{ {'style': chip_style ~ (claimed_style | format((shown | count) - claimed + 1, shown | count)
            if claimed else '')} }} },
        ]},
      {%- endfor -%}
  grid_options:
    columns: full
    rows: 4
# Lists: two half-width lists in a 4-row band. On a School Day afternoon,
# After-School Tasks takes the Family Reminders slot.
- type: todo-list
  entity: '{SHOPPING_LIST_TODO}'
  title: Shopping List
  hide_completed: true
  hide_section_headers: true
  grid_options:
    columns: 6
    rows: 4
- type: todo-list
  entity: '{FAMILY_REMINDERS_TODO}'
  title: Family Reminders
  hide_completed: true
  hide_section_headers: true
  visibility:
  - condition: or
    conditions:
    - condition: state
      entity: '{TODAY_SCHOOL_DAY_HELPER}'
      state_not: 'on'
    - condition: time
      before: '12:00'
  grid_options:
    columns: 6
    rows: 4
- type: todo-list
  entity: '{AFTER_SCHOOL_TASKS_TODO}'
  title: After-School Tasks
  hide_completed: true
  hide_section_headers: true
  visibility:
  - condition: state
    entity: '{TODAY_SCHOOL_DAY_HELPER}'
    state: 'on'
  - condition: time
    after: '12:00'
  grid_options:
    columns: 6
    rows: 4
