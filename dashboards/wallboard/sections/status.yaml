type: grid
cards:
- type: custom:better-moment-card
  parentStyle: "line-height:normal;\npadding-bottom:0em;\ndisplay: grid; \ngrid-template-columns:\
    \ 1fr 1fr 1fr; \ngrid-template-rows: 1fr 1fr; \ngap: 0px; \ngrid-template-areas:\
    \ \n  'time time riyadh'\n  'date date brussells'; \n"
  moment:
  - format: h:mm a
    parentStyle: "font-size:4em; \ntext-align:center; \nfont-weight:400; \ngrid-area:\
      \ time;\nfont-weight:500\n"
  - format: cccc, MMMM d
    parentStyle: "font-size:1.6em;\nline-height:1em; text-align:center;\npadding-top:0.5em;\n\
      grid-area: date; \n"
  - format: HH:mm
    timezone: Europe/Madrid
    parentStyle: "text-align:center; \nline-height:2em; \npadding-top:0.2em; \ngrid-area:\
      \ riyadh;\n"
    template: "<strong>\U0001F1EA\U0001F1F8 Madrid</strong>\n<div style=\"font-size:1.2em;\"\
      >{{moment}}</div>\n"
  - format: HH:mm
    timezone: Europe/London
    parentStyle: "text-align:center; \nline-height:2em; \ngrid-area: brussells;\n"
    template: "<strong>\U0001F1EC\U0001F1E7 London</strong>\n<div style=\"font-size:1.2em;\"\
      >{{moment}}</div>\n"
- type: custom:clock-weather-card
  entity: '{WEATHER_ENTITY}'
  locale: en-US
  hide_date: true
  hide_clock: true
- type: custom:hourly-weather
  entity: '{HOURLY_WEATHER_FORECAST_SENSOR}'
  name: Next Hours
  num_segments: 8
  label_spacing: 2
  icons: true
  show_wind: 'true'
  show_date: boundary
  show_precipitation_amounts: true
  show_precipitation_probability: true
- type: conditional
  conditions:
  - condition: numeric_state
    entity: '{OUTDOOR_AQI_SENSOR}'
    above: 100
  card:
    type: custom:mushroom-template-card
    primary: Air Quality Alert
    secondary: Outdoor AQI is {{ states('{OUTDOOR_AQI_SENSOR}') }}
    icon: mdi:air-filter
    icon_color: red
    tap_action:
      action: none
- type: custom:atomic-calendar-revive
  name: Next Up
  entities:
  - entity: '{FAMILY_CALENDAR}'
    name: Family
  - entity: '{APPOINTMENTS_CALENDAR}'
    name: Appointments
  - entity: '{TRIPS_BREAKS_CALENDAR}'
    name: Trips & Breaks
  - entity: '{BIRTHDAYS_CALENDAR}'
    name: Birthdays
  - entity: '{SCHOOL_CLOSURES_CALENDAR}'
    name: School
  maxDaysToShow: 2
  maxEventCount: 6
  showRelativeTime: true
  showLocation: false
  showProgressBar: false
  disableCalEventLink: true
  disableCalLocationLink: true
  disableCalLink: true
  defaultMode: Event
- type: entities
  entities:
  - entity: '{SUNRISE_SENSOR}'
    name: Sunrise
    secondary_info: none
    icon: mdi:sun-clock
  - entity: '{SUNSET_SENSOR}'
    name: Sunset
    icon: mdi:sun-clock-outline
  grid_options:
    columns: 12
    rows: auto
