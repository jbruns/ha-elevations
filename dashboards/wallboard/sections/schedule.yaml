type: grid
cards:
- type: conditional
  conditions:
  - condition: state
    entity: '{SAFETY_IMMEDIATE_HAZARDS_ROLE}'
    state: 'on'
  card:
    type: custom:mushroom-template-card
    primary: Safety Alert
    secondary: '{{ expand(''{SAFETY_IMMEDIATE_HAZARDS_ROLE}'') | selectattr(''state'',
      ''eq'', ''on'') | map(attribute=''name'') | join('', '') }}'
    icon: mdi:alert-octagon
    icon_color: red
    multiline_secondary: true
    tap_action:
      action: none
  grid_options:
    columns: full
    rows: 1
- type: conditional
  conditions:
  - condition: state
    entity: '{GARAGE_DOOR_COVER}'
    state: open
  card:
    type: custom:mushroom-template-card
    primary: Garage Door Open
    secondary: '{GARAGE_DOOR_LABEL}'
    icon: mdi:garage-open
    icon_color: orange
    tap_action:
      action: none
  grid_options:
    columns: 6
    rows: 1
- type: conditional
  conditions:
  - condition: state
    entity: '{SCHOOL_DAY_DROPDOWN}'
    state: 'true'
  card:
    type: custom:mushroom-template-card
    primary: It's a School Day!
    secondary: ''
    icon: mdi:school
    badge_icon: ''
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    fill_container: false
    icon_color: ''
    multiline_secondary: false
- type: conditional
  conditions:
  - condition: state
    entity: '{SCHOOL_DAY_DROPDOWN}'
    state: 'true'
  card:
    type: custom:mushroom-entity-card
    entity: '{CHILD_A_SPECIAL_CLASS_DROPDOWN}'
    name: '{CHILD_A_NAME}''s Special Class'
    primary_info: state
    secondary_info: name
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    icon: mdi:calendar
  layout_options:
    grid_columns: 2
    grid_rows: 1
- type: conditional
  conditions:
  - condition: state
    entity: '{SCHOOL_DAY_DROPDOWN}'
    state: 'true'
  card:
    type: custom:mushroom-entity-card
    entity: '{CHILD_B_SPECIAL_CLASS_DROPDOWN}'
    name: '{CHILD_B_NAME}''s Special Class'
    primary_info: state
    secondary_info: name
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    icon: mdi:calendar
  layout_options:
    grid_columns: 2
    grid_rows: 1
- initial_view: listWeek
  type: calendar
  entities:
  - '{US_HOLIDAYS_CALENDAR}'
  - '{APPOINTMENTS_CALENDAR}'
  - '{FAMILY_CALENDAR}'
  - '{TRIPS_BREAKS_CALENDAR}'
  - '{SCHOOL_CLOSURES_CALENDAR}'
  layout_options:
    grid_columns: full
    grid_rows: 9
  title: Family Calendar
  card_mod:
    style: "ha-card {\n  overflow-x: scroll;\n}\n"
- type: custom:atomic-calendar-revive
  name: School Lunch
  enableModeChange: true
  entities:
  - entity: '{SCHOOL_LUNCH_CALENDAR}'
    name: School Lunch
  hideDuplicates: false
  showRelativeTime: false
  offsetHeaderDate: false
  showAllDayEvents: true
  showLocation: false
  eventDateFormat: ddd
  showProgressBar: false
  showAllDayHours: false
  disableCalEventLink: true
  disableCalLocationLink: true
  disableCalLink: true
  defaultMode: Event
  grid_options:
    columns: 6
    rows: 7
- type: todo-list
  entity: '{FAMILY_REMINDERS_TODO}'
  title: Family Reminders
  hide_completed: true
  grid_options:
    columns: 18
    rows: 7
  card_mod:
    style: "ha-card {\n  overflow-x: scroll;\n}\n"
column_span: 2
