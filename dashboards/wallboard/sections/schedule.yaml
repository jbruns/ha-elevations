# Household Schedule: about 2/3 of the width, below the glance band, with the
# Lists beneath the week grid.
type: grid
column_span: 2
cards:
# week-planner-card has no title tap action, so this heading opens Month.
# A relative navigation_path keeps working whatever url_path the dashboard has.
- type: heading
  heading: Household Schedule
  heading_style: title
  icon: mdi:calendar-month
  tap_action:
    action: navigate
    navigation_path: month
  grid_options:
    columns: full
    rows: 1
- type: custom:week-planner-card
  days: 7
  startingDay: today
  locale: en-US
  timeFormat: h:mm a
  dayFormat: ccc LLL d
  hidePastEvents: true
  compact: false
  noCardBackground: true
  showLocation: false
  showLegend: true
  legendToggle: true
  showNavigation: false
  showWeekDayText: true
  # The card already merges identical events from one calendar; true would also merge across calendars.
  combineSimilarEvents: false
  weather:
    entity: '{WEATHER_ENTITY}'
    showCondition: true
    showTemperature: true
    showLowTemperature: true
  columns:
    extraLarge: 7
    large: 7
    medium: 7
    small: 7
    extraSmall: 1
  calendars:
  - entity: '{FAMILY_CALENDAR}'
    name: Family
    color: '#2f80ed'
  - entity: '{APPOINTMENTS_CALENDAR}'
    name: Appointments
    color: '#9b51e0'
  - entity: '{TRIPS_BREAKS_CALENDAR}'
    name: Trips & breaks
    color: '#27ae60'
  - entity: '{BIRTHDAYS_CALENDAR}'
    name: Birthdays
    color: '#f2994a'
  - entity: '{US_HOLIDAYS_CALENDAR}'
    name: US holidays
    color: '#eb5757'
  - entity: '{SCHOOL_CLOSURES_CALENDAR}'
    name: Holidays/closures
    color: '#56ccf2'
  - entity: '{COLLECTION_CALENDAR}'
    name: Collection
    color: '#828282'
  texts:
    today: Today
    tomorrow: Tomorrow
    fullDay: All day
    noEvents: No events
  card_mod:
    style: |
      .day.today { box-sizing: border-box; padding: 2px 6px; border: 3px solid var(--accent-color, #03a9f4); border-radius: 10px; box-shadow: inset 0 0 8px var(--accent-color, #03a9f4); }
      .container .day .date { font-size: 1.05rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.35rem; }
      .container .day.today .date { font-size: 0; }
      .container .day.today .date::before { content: 'Today'; font-size: 1.05rem; }
      .container .day .weather { position: static !important; display: flex; align-items: center; gap: 4px; min-height: 28px; }
      ha-card { height: 100%; overflow-y: auto; }
  grid_options:
    columns: full
    rows: 8
# Lists: two half-width lists in a 4-row band under the week grid. On a School
# Day afternoon, After-School Tasks takes the Family Reminders slot.
- type: todo-list
  entity: '{SHOPPING_LIST_TODO}'
  title: Shopping List
  hide_completed: true
  hide_section_headers: true
  grid_options:
    columns: 12
    rows: 4
- type: todo-list
  entity: '{FAMILY_REMINDERS_TODO}'
  title: Family Reminders
  hide_completed: true
  hide_section_headers: true
  visibility:
  - condition: or
    conditions:
    - condition: state
      entity: '{TODAY_SCHOOL_DAY_HELPER}'
      state_not: 'on'
    - condition: time
      before: '12:00'
  grid_options:
    columns: 12
    rows: 4
- type: todo-list
  entity: '{AFTER_SCHOOL_TASKS_TODO}'
  title: After-School Tasks
  hide_completed: true
  hide_section_headers: true
  visibility:
  - condition: state
    entity: '{TODAY_SCHOOL_DAY_HELPER}'
    state: 'on'
  - condition: time
    after: '12:00'
  grid_options:
    columns: 12
    rows: 4
