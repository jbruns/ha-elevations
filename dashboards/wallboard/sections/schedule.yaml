# Household Schedule: about 2/3 of the width, below the glance band.
type: grid
column_span: 2
cards:
# week-planner-card has no title tap action, so this heading opens Month.
# A relative navigation_path keeps working whatever url_path the dashboard has.
- type: heading
  heading: Household Schedule
  heading_style: title
  icon: mdi:calendar-month
  tap_action:
    action: navigate
    navigation_path: month
  grid_options:
    columns: full
    rows: 1
- type: custom:week-planner-card
  days: 7
  startingDay: today
  locale: en-US
  timeFormat: h:mm a
  dayFormat: ccc LLL d
  hidePastEvents: true
  compact: false
  noCardBackground: true
  showLocation: false
  showLegend: true
  legendToggle: true
  showNavigation: false
  showWeekDayText: true
  combineSimilarEvents: false
  weather:
    entity: '{WEATHER_ENTITY}'
    showCondition: true
    showTemperature: true
    showLowTemperature: true
  columns:
    extraLarge: 7
    large: 7
    medium: 7
    small: 7
    extraSmall: 1
  calendars:
  - entity: '{FAMILY_CALENDAR}'
    name: Family
    color: '#2f80ed'
  - entity: '{APPOINTMENTS_CALENDAR}'
    name: Appointments
    color: '#9b51e0'
  - entity: '{TRIPS_BREAKS_CALENDAR}'
    name: Trips & breaks
    color: '#27ae60'
  - entity: '{BIRTHDAYS_CALENDAR}'
    name: Birthdays
    color: '#f2994a'
  - entity: '{US_HOLIDAYS_CALENDAR}'
    name: US holidays
    color: '#eb5757'
  - entity: '{SCHOOL_CLOSURES_CALENDAR}'
    name: Holidays/closures
    color: '#56ccf2'
  - entity: '{COLLECTION_CALENDAR}'
    name: Collection
    color: '#828282'
  texts:
    today: Today
    tomorrow: Tomorrow
    fullDay: All day
    noEvents: No events
  card_mod:
    style: |
      .day.today { box-sizing: border-box; border: 3px solid var(--accent-color, #03a9f4); border-radius: 10px; box-shadow: inset 0 0 8px var(--accent-color, #03a9f4); }
      .container .day .date { font-size: 1.05rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.35rem; }
      .container .day.today .date { font-size: 0; }
      .container .day.today .date::before { content: 'Today'; font-size: 1.05rem; }
  grid_options:
    columns: full
    rows: 11
