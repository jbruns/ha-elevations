name: HA canary

on:
  schedule:
    # Mondays, after Renovate's weekly run (before 6am America/Los_Angeles).
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: HA canary
    uses: ./.github/workflows/ha-tests.yml
    with:
      mode: canary
